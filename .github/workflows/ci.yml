name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: clang-format --dry-run --Werror
        run: |
          find include src tests -type f \( -name '*.cc' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake ninja-build
      - name: Configure (compile_commands.json for the library only)
        run: cmake --preset dev -DTAUT_BUILD_TESTS=OFF
      - name: clang-tidy (src + public headers; checks in .clang-tidy)
        run: clang-tidy -p build/dev src/*.cc

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: fuzz_decode 60 s smoke (ASan/UBSan, must stay crash-free)
        run: ./fuzz/run_fuzz.sh decode 60

  sim-suite:
    # Deterministic SimNet scenario suite (§6.3): seeded loss/reorder/dup/delay transfers
    # over the in-process simulator, run under ASan/UBSan. Seed-reproducible by construction.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: Configure
        run: cmake --preset dev
      - name: Build unit/sim tests
        run: cmake --build --preset dev --target taut_unit
      - name: Run SimNet + Session scenarios
        run: ctest --preset dev -R 'SimNet\.|Session\.' --output-on-failure
