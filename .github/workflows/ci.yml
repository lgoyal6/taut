name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Proves the *installed* package is usable, which an in-tree
  # add_subdirectory build does not: install to a prefix, then configure
  # examples/telemetry on its own against only that prefix and run it. The
  # example asserts its own invariants (exactly-once in-order delivery across a
  # 20% loss link, retransmits actually happened) and exits nonzero on mismatch.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: Build and install taut
        run: |
          cmake -S . -B build/inst -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ -DTAUT_BUILD_TESTS=OFF
          cmake --build build/inst --target taut
          cmake --install build/inst --prefix "${RUNNER_TEMP}/prefix"
      - name: Build the example against the installed package only
        run: |
          cmake -S examples/telemetry -B "${RUNNER_TEMP}/telemetry" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/prefix"
          cmake --build "${RUNNER_TEMP}/telemetry"
          "${RUNNER_TEMP}/telemetry/telemetry"

  package-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - run: ./scripts/test-package-upgrade.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: clang-format --dry-run --Werror
        run: |
          find include src tests examples -type f \( -name '*.cc' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake ninja-build
      - name: Configure (compile_commands.json for the library only)
        run: cmake --preset dev -DTAUT_BUILD_TESTS=OFF
      - name: clang-tidy (src + public headers; checks in .clang-tidy)
        run: clang-tidy -p build/dev src/*.cc

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: fuzz_decode 60 s smoke (ASan/UBSan, must stay crash-free)
        run: ./fuzz/run_fuzz.sh decode 60

  sim-suite:
    # Deterministic SimNet scenario suite (§6.3): seeded loss/reorder/dup/delay transfers
    # over the in-process simulator, run under ASan/UBSan. Seed-reproducible by construction.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: Configure
        run: cmake --preset dev
      - name: Build unit/sim tests
        run: cmake --build --preset dev --target taut_unit
      - name: Run SimNet + Session scenarios
        run: ctest --preset dev -R 'SimNet\.|Session\.' --output-on-failure
